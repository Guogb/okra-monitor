[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

; Use huge_app partition for more flash space (3MB for app)
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl@^8.4.0
    h2zero/NimBLE-Arduino@^1.4.1
    bblanchon/ArduinoJson@^7.4.3
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; -include 在任何源文件处理前强制注入本地 User_Setup.h，
; -DUSER_SETUP_LOADED=1 让 TFT_eSPI 跳过 libdeps 里自带的默认 User_Setup.h。
; 否则 PlatformIO 的 include 路径会把 libdeps 排在 lib/ 前面，
; 本地的 CYD 硬件配置会被静默忽略（换机即白屏/引脚错乱）。
; 修改屏幕引脚/驱动请编辑 lib/TFT_eSPI/User_Setup.h，不要改 .pio/libdeps 里的副本。
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -include ${PROJECT_DIR}/lib/TFT_eSPI/User_Setup.h
    -DUSER_SETUP_LOADED=1

upload_speed = 460800
